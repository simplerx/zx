id = "zx"
name = "zx"
version = "0.48.0"
schema_version = 1
authors = ["simplex"]
description = "Zx language support: syntax highlighting, outline and the zxls language server."
repository = "https://gitcode.com/simplex/zx"

languages = ["languages/zx"]

[lib]
kind = "Rust"
version = "0.7.0"

[language_servers.zx-lsp]
languages = ["Zx"]

[grammars.zx]
