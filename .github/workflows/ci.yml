# zx CI —— 把本地那套回归搬到云端，不再全靠手动。
#
# 平台：windows-latest。理由：test.sh / bootstrap/diff_ast.sh / tools/stress.sh
# 大量路径写死 `.exe`（bin/zxc.exe、runner.exe、临时产物.exe），Git Bash +
# Windows 是这套脚本的原生环境；换成 Linux 要先做一轮平台探测重构。
#
# job 分工：
#   setup-zig    预热 zig.exe 缓存，后面三个 job needs 它，避免并行各下一次 190MB
#   build-test   构建编译器 + 校验产物齐全 + 全量 test.sh（600+ 项）
#   ast-diff     构建 astdump + 双前端 AST 对拍
#   robustness   fuzz 变异 + LSP smoke/压力 + 双前端词法对拍
#   grammar-sync tree-sitter 生成物与 grammar.js 一致性（无需 zig）
#
# 触发：push / PR 到 main；也可在 Actions 页手动重跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消旧的在跑任务，省 runner 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"
  TREE_SITTER_VERSION: "0.27.2"

jobs:
  # 只负责把 zig.exe 塞进缓存；下游仍保留 install 兜底，缓存服务异常也不会
  # 让整个 CI 挂掉。needs 保证下游启动时缓存已经写好。
  setup-zig:
    name: 预热 Zig 工具链缓存
    runs-on: windows-latest
    steps:
      - uses: actions/cache@v4
        id: zigcache
        with:
          path: .toolchain/zig.exe
          key: zig-${{ env.ZIG_VERSION }}-windows-x86_64

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        if: steps.zigcache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .toolchain | Out-Null
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-windows-x86_64-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile .toolchain/zig.zip
          Expand-Archive -Path .toolchain/zig.zip -DestinationPath .toolchain -Force
          Move-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION/zig.exe" .toolchain/zig.exe -Force
          Remove-Item .toolchain/zig.zip -Recurse -Force
          Remove-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION" -Recurse -Force

  build-test:
    name: 构建 + 全量回归
    needs: setup-zig
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Zig 工具链
        id: zigcache
        uses: actions/cache@v4
        with:
          path: .toolchain/zig.exe
          key: zig-${{ env.ZIG_VERSION }}-windows-x86_64

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        if: steps.zigcache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .toolchain | Out-Null
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-windows-x86_64-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile .toolchain/zig.zip
          Expand-Archive -Path .toolchain/zig.zip -DestinationPath .toolchain -Force
          Move-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION/zig.exe" .toolchain/zig.exe -Force
          Remove-Item .toolchain/zig.zip -Recurse -Force
          Remove-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION" -Recurse -Force

      - name: 构建编译器（含自举 zxfe）
        shell: bash
        run: sh build.sh

      - name: 校验构建产物齐全
        shell: bash
        run: |
          for f in bin/zxc.exe bin/zxfe.exe bin/zxls.exe; do
            test -x "$f" || { echo "missing build artifact: $f"; exit 1; }
          done
          echo "zxc / zxfe / zxls all present"

      - name: 全量回归 test.sh
        shell: bash
        run: sh test.sh

  ast-diff:
    name: 双前端 AST 对拍
    needs: setup-zig
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Zig 工具链
        id: zigcache
        uses: actions/cache@v4
        with:
          path: .toolchain/zig.exe
          key: zig-${{ env.ZIG_VERSION }}-windows-x86_64

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        if: steps.zigcache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .toolchain | Out-Null
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-windows-x86_64-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile .toolchain/zig.zip
          Expand-Archive -Path .toolchain/zig.zip -DestinationPath .toolchain -Force
          Move-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION/zig.exe" .toolchain/zig.exe -Force
          Remove-Item .toolchain/zig.zip -Recurse -Force
          Remove-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION" -Recurse -Force

      - name: 构建编译器
        shell: bash
        run: sh build.sh

      - name: 构建 astdump + 双前端对拍
        shell: bash
        run: |
          ./bin/zxc.exe bootstrap/astdump.zx -o bin/astdump.exe
          sh bootstrap/diff_ast.sh

      - name: 错误路径双前端对拍（bad / multibad 首诊断码）
        shell: bash
        run: sh bootstrap/diff_errors.sh

  robustness:
    name: 健壮性（fuzz + LSP + 词法对拍）
    needs: setup-zig
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Zig 工具链
        id: zigcache
        uses: actions/cache@v4
        with:
          path: .toolchain/zig.exe
          key: zig-${{ env.ZIG_VERSION }}-windows-x86_64

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        if: steps.zigcache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .toolchain | Out-Null
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-windows-x86_64-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile .toolchain/zig.zip
          Expand-Archive -Path .toolchain/zig.zip -DestinationPath .toolchain -Force
          Move-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION/zig.exe" .toolchain/zig.exe -Force
          Remove-Item .toolchain/zig.zip -Recurse -Force
          Remove-Item ".toolchain/zig-windows-x86_64-$env:ZIG_VERSION" -Recurse -Force

      - name: 构建编译器
        shell: bash
        run: sh build.sh

      - name: 变异 fuzz（300 次快速冒烟）
        shell: bash
        run: python tools/fuzz.py 300 .tmp/ci-fuzz

      - name: LSP smoke（ZXLS_BIN 指向构建产物）
        shell: bash
        run: ZXLS_BIN=bin/zxls.exe python tools/lsptest.py

      - name: LSP 压力（protocol abuse + document storm）
        shell: bash
        run: ZXLS_BIN=bin/zxls.exe python tools/lspstress.py

      - name: 构建 lexdump + 双前端词法对拍
        shell: bash
        run: |
          ./bin/zxc.exe bootstrap/lexdump.zx -o bin/lexdump.exe
          sh bootstrap/diff_lex.sh

  grammar-sync:
    name: 语法生成物与 grammar.js 一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 tree-sitter CLI
        shell: bash
        run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_VERSION }}

      - name: 重新生成并比对
        shell: bash
        run: |
          cd editor/tree-sitter-zx
          tree-sitter generate
          cd ../..
          git diff --exit-code -- editor/tree-sitter-zx/src/
